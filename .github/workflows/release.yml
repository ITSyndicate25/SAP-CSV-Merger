name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller sap_csv_merger.spec

      - name: Create ZIP archive
        run: Compress-Archive -Path dist/SAP_CSV_Merger -DestinationPath SAP_CSV_Merger.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SAP_CSV_Merger.zip
            dist/SAP_CSV_Merger/SAP_CSV_Merger.exe
          generate_release_notes: true
