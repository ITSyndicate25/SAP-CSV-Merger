name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller sap_csv_merger.spec

      - name: Verify build output
        run: |
          if (Test-Path dist/SAP_CSV_Merger.exe) {
            Write-Host "Build verified: SAP_CSV_Merger.exe exists"
          } else {
            Write-Error "Build failed: SAP_CSV_Merger.exe not found"
            exit 1
          }

      - name: Generate changelog
        id: changelog
        shell: bash
        env:
          REPO: ${{ github.repository }}
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          CURRENT_TAG=${GITHUB_REF_NAME}
          REPO_URL="https://github.com/${REPO}"

          # Collect commits since last tag
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s|||%h" HEAD)
          else
            COMMITS=$(git log --pretty=format:"%s|||%h" "${PREV_TAG}..HEAD")
          fi

          # Initialize temp files for each category
          ADDED_FILE=$(mktemp)
          CHANGED_FILE=$(mktemp)
          FIXED_FILE=$(mktemp)
          WHATS_CHANGED_FILE=$(mktemp)

          # Categorize each commit
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            MSG=$(echo "$line" | cut -d'|' -f1)
            HASH=$(echo "$line" | cut -d'|' -f4)
            COMMIT_URL="${REPO_URL}/commit/${HASH}"

            # Build the What's Changed entry (full message with link)
            WHATS_ENTRY="- ${MSG} ([${HASH}](${COMMIT_URL}))"
            echo "$WHATS_ENTRY" >> "$WHATS_CHANGED_FILE"

            # Strip conventional commit prefix for categorized sections
            CLEAN_MSG=$(echo "$MSG" | sed -E 's/^[a-z]+(\([^)]*\))?: //I')

            # Categorize by commit type
            case "$MSG" in
              feat*)
                echo "- ${CLEAN_MSG} ([${HASH}](${COMMIT_URL}))" >> "$ADDED_FILE"
                ;;
              fix*)
                echo "- ${CLEAN_MSG} ([${HASH}](${COMMIT_URL}))" >> "$FIXED_FILE"
                ;;
              perf*|refactor*|ci*|chore*|build*|style*|docs*|test*)
                echo "- ${CLEAN_MSG} ([${HASH}](${COMMIT_URL}))" >> "$CHANGED_FILE"
                ;;
              *)
                echo "- ${CLEAN_MSG} ([${HASH}](${COMMIT_URL}))" >> "$CHANGED_FILE"
                ;;
            esac
          done <<< "$COMMITS"

          # Build markdown
          {
            # Categorized sections
            if [ -s "$ADDED_FILE" ]; then
              echo "### Added"
              echo ""
              cat "$ADDED_FILE"
              echo ""
            fi

            if [ -s "$CHANGED_FILE" ]; then
              echo "### Changed"
              echo ""
              cat "$CHANGED_FILE"
              echo ""
            fi

            if [ -s "$FIXED_FILE" ]; then
              echo "### Fixed"
              echo ""
              cat "$FIXED_FILE"
              echo ""
            fi

            # What's Changed section
            if [ -s "$WHATS_CHANGED_FILE" ]; then
              echo "## What's Changed"
              echo ""
              cat "$WHATS_CHANGED_FILE"
              echo ""
            fi

            # Full Changelog link
            echo "**Full Changelog**: [${PREV_TAG:-initial}...${CURRENT_TAG}](${REPO_URL}/compare/${PREV_TAG:-${CURRENT_TAG}}...${CURRENT_TAG})"
          } > CHANGELOG.md

          # Cleanup
          rm -f "$ADDED_FILE" "$CHANGED_FILE" "$FIXED_FILE" "$WHATS_CHANGED_FILE"

          # Read changelog content
          {
            echo "changelog<<EOF"
            cat CHANGELOG.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Package release archive
        run: |
          $version = (Get-Content pyproject.toml |
            ForEach-Object { if ($_ -match '^version = "(.+)"$') { $Matches[1] } })
          $staging = "release/SAP_CSV_Merger"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          # install.bat and uninstall.bat ship together: the installer copies the
          # uninstaller and refuses to run without it.
          Copy-Item dist/SAP_CSV_Merger.exe $staging
          Copy-Item install.bat, uninstall.bat, README.md $staging
          Compress-Archive -Path $staging -DestinationPath "release/SAP_CSV_Merger_$version.zip" -Force
          Get-ChildItem release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            dist/SAP_CSV_Merger.exe
            release/SAP_CSV_Merger_*.zip
          body: |
            ${{ steps.changelog.outputs.changelog }}
